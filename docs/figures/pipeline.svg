<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 540" width="1200" height="540" font-family="Helvetica, Arial, sans-serif">
  <title>Embryo Scan analysis pipeline</title>
  <desc>Two pipelines. A: time-lapse videos are cropped and stacked, classified frame by frame by a ResNet-34 into 16 developmental phases, decoded into a monotonic phase sequence and converted to division times, which feed a viability ranking; a classical MATLAB baseline is scored with the same rules. B: day-5 blastocyst images are graded by a five-model ConvNeXt-Tiny ensemble with Grad-CAM attribution, and the grades and image embeddings are analysed against live birth. Both are evaluated on patient-level partitions with patient-cluster bootstrap confidence intervals.</desc>
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#5b6577"/>
    </marker>
  </defs>
  <rect x="0" y="0" width="1200" height="540" rx="14" fill="#ffffff"/>

  <!-- lane labels -->
  <text x="24" y="38" font-size="15" font-weight="700" fill="#0d1424">A · Time-lapse pipeline: division timing and viability ranking</text>
  <text x="24" y="292" font-size="15" font-weight="700" fill="#0d1424">B · Blastocyst image pipeline: Gardner grading and outcome analysis</text>

  <!-- lane A -->
  <g font-size="12.5" fill="#5b6577">
    <rect x="20" y="56" width="190" height="84" rx="10" fill="#f6f7f9" stroke="#d5d9e0"/>
    <text x="34" y="80" font-size="14" font-weight="700" fill="#0d1424">Time-lapse videos</text>
    <text x="34" y="100">Gomez et al. (2022)</text>
    <text x="34" y="118">704 videos · 542 patients</text>

    <rect x="240" y="56" width="190" height="84" rx="10" fill="#f6f7f9" stroke="#d5d9e0"/>
    <text x="254" y="80" font-size="14" font-weight="700" fill="#0d1424">Preprocessing</text>
    <text x="254" y="100">embryo crop, 160 × 160 px</text>
    <text x="254" y="118">3-frame stack (±45 min)</text>

    <rect x="460" y="56" width="190" height="84" rx="10" fill="#eef2ff" stroke="#2f5bff"/>
    <text x="474" y="80" font-size="14" font-weight="700" fill="#2f5bff">Phase classifier</text>
    <text x="474" y="100">ResNet-34, 16 phases</text>
    <text x="474" y="118">4-view test-time augm.</text>

    <rect x="680" y="56" width="190" height="84" rx="10" fill="#eef2ff" stroke="#2f5bff"/>
    <text x="694" y="80" font-size="14" font-weight="700" fill="#2f5bff">Monotonic decoding</text>
    <text x="694" y="100">dynamic programming</text>
    <text x="694" y="118">onsets t2 … tEB</text>

    <rect x="900" y="56" width="280" height="84" rx="10" fill="#f6f7f9" stroke="#d5d9e0"/>
    <text x="914" y="80" font-size="14" font-weight="700" fill="#0d1424">Viability ranking</text>
    <text x="914" y="100">logistic regression on 0–72 h timings</text>
    <text x="914" y="118">P(blastocyst by 116 h) · 97 test videos</text>

    <rect x="460" y="172" width="410" height="66" rx="10" fill="#fdf3e6" stroke="#e8890c" stroke-dasharray="5 4"/>
    <text x="474" y="196" font-size="14" font-weight="700" fill="#b86a06">Classical baseline (MATLAB, no learning)</text>
    <text x="474" y="216">circular Hough localization · motion energy · timing rules</text>
  </g>
  <g stroke="#5b6577" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="98" x2="236" y2="98"/>
    <line x1="430" y1="98" x2="456" y2="98"/>
    <line x1="650" y1="98" x2="676" y2="98"/>
    <line x1="870" y1="98" x2="896" y2="98"/>
    <path d="M115 140 V205 H456"/>
  </g>
  <line x1="775" y1="168" x2="775" y2="145" stroke="#e8890c" stroke-width="1.6" stroke-dasharray="4 3" marker-start="url(#arrow)" marker-end="url(#arrow)"/>
  <text x="786" y="162" font-size="11.5" fill="#5b6577">t2–t5 compared under identical scoring rules</text>

  <!-- lane B -->
  <g font-size="12.5" fill="#5b6577">
    <rect x="20" y="310" width="190" height="84" rx="10" fill="#f6f7f9" stroke="#d5d9e0"/>
    <text x="34" y="334" font-size="14" font-weight="700" fill="#0d1424">Blastocyst images</text>
    <text x="34" y="354">Kromp et al. (2023)</text>
    <text x="34" y="372">2,344 images · 851 patients</text>

    <rect x="240" y="310" width="190" height="84" rx="10" fill="#f6f7f9" stroke="#d5d9e0"/>
    <text x="254" y="334" font-size="14" font-weight="700" fill="#0d1424">Preprocessing</text>
    <text x="254" y="354">grayscale, 384 × 288 px</text>
    <text x="254" y="372">GPU-side augmentation</text>

    <rect x="460" y="310" width="190" height="84" rx="10" fill="#eef2ff" stroke="#2f5bff"/>
    <text x="474" y="334" font-size="14" font-weight="700" fill="#2f5bff">Gardner grader</text>
    <text x="474" y="354">ConvNeXt-Tiny, 3 heads</text>
    <text x="474" y="372">5-fold cross-fitting</text>

    <rect x="680" y="310" width="190" height="84" rx="10" fill="#eef2ff" stroke="#2f5bff"/>
    <text x="694" y="334" font-size="14" font-weight="700" fill="#2f5bff">Ensemble inference</text>
    <text x="694" y="354">5 models × 8 views</text>
    <text x="694" y="372">grade + Grad-CAM map</text>

    <rect x="900" y="310" width="280" height="84" rx="10" fill="#f6f7f9" stroke="#d5d9e0"/>
    <text x="914" y="334" font-size="14" font-weight="700" fill="#0d1424">Live-birth analysis</text>
    <text x="914" y="354">603 transferred embryos, 5-fold CV</text>
    <text x="914" y="372">grades · embeddings · clinical data</text>
  </g>
  <g stroke="#5b6577" stroke-width="1.6" fill="none" marker-end="url(#arrow)">
    <line x1="210" y1="352" x2="236" y2="352"/>
    <line x1="430" y1="352" x2="456" y2="352"/>
    <line x1="650" y1="352" x2="676" y2="352"/>
    <line x1="870" y1="352" x2="896" y2="352"/>
  </g>

  <!-- evaluation protocol -->
  <rect x="20" y="430" width="1160" height="88" rx="10" fill="#0d1424"/>
  <text x="40" y="458" font-size="14" font-weight="700" fill="#ffffff">Evaluation protocol (both pipelines)</text>
  <text x="40" y="482" font-size="12.5" fill="#c9d1dc">Patient-level partitions · test data never used for training or tuning · 95% CIs from a patient-cluster bootstrap (2,000 resamples)</text>
  <text x="40" y="502" font-size="12.5" fill="#c9d1dc">Metric parity with the dataset authors' published scoring code · patient-overlap control experiment · paired comparisons against clinical baselines</text>
</svg>
