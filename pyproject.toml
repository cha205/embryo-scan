[project]
name = "embryoscan"
version = "0.1.0"
description = "Embryo grading and IVF outcome prediction from blastocyst images"
requires-python = ">=3.10"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["embryoscan*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
