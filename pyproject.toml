[project]
name = "embryoscan"
version = "0.1.0"
description = "Division timing, viability ranking and grading of IVF embryos from time-lapse videos and photos"
requires-python = ">=3.10"
license = "MIT"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
include = ["embryoscan*"]

[tool.pytest.ini_options]
testpaths = ["tests/python"]

[tool.ruff]
line-length = 120
target-version = "py310"
extend-exclude = ["data", "runs", "web", "scratch"]

[tool.ruff.lint]
select = ["E", "W", "F", "I", "B", "UP", "NPY"]

[tool.ruff.lint.isort]
known-first-party = ["embryoscan", "server"]
